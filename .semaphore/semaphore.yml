version: v1.0
name: Docker
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Build
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - echo $DOCKER_PASSWORD | docker login \
            - ' --username "$DOCKER_USERNAME" \'
            - ' $DOCKER_REGISTRY_URL --password-stdin'
            - docker pull \
            - ' $DOCKER_USERNAME/demo:latest || true'
            - docker build \
            - ' -- cache-from $DOCKER_USERNAME/demo:latest \'
            - ' -t $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID .'
            - docker push \
            - ' $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID'
      secrets:
        - name: dockerhub
  - name: Test
    task:
      prologue:
        commands:
          - docker login \
          - ' -u $SEMAPHORE_REGISTRY_USERNAME \'
          - ' -p $SEMAPHORE_REGISTRY_PASSWORD \'
          - ' $SEMAPHORE_REGISTRY_URL'
          - docker pull \
          - ' $SEMAPHORE_REGISTRY_URL/demo:$SEMAPHORE_WORKFLOW_ID'
      jobs:
        - name: UnitTest
          commands:
            - docker run -it \
            - ' $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run lint'
        - name: FunctionalTest
          commands:
            - sem-service start postgres
            - docker run --net=host -it \
            - ' $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run ping'
            - docker run --net=host -it \
            - ' $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run migrate'
        - name: IntegrationTest
          commands:
            - sem-service start postgres
            - docker run --net=host -it \
            - ' $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run test'
      secrets:
        - name: dockerhub
  - name: Push
    task:
      jobs:
        - name: Push
          commands:
            - docker login \
            - ' -u $DOCKER_USERNAME -p $DOCKER_PASSWORD'
            - docker pull \
            - ' $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID'
            - docker tag \
            - ' $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' $DOCKER_USERNAME/demo:latest'
            - docker push \
            - ' $DOCKER_USERNAME/demo:latest'
      secrets:
        - name: dockerhub
