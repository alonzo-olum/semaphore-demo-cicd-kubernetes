version: v1.0
name: Docker
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Build
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - docker login
            - 'docker build -t $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID .'
            - 'docker push $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID'
      secrets:
        - name: dockerhub
  - name: Test
    task:
      secrets:
        - name: dockerhub
      prologue:
        commands:
          - docker login
          - 'docker pull $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID'
      jobs:
        - name: Unit Test
          commands:
            - 'docker run -it $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run lint'
        - name: Functional Test
          commands:
            - sem-service start postgres
            - 'docker run --net=host -it $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run ping'
            - 'docker run --net=host -it $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run migrate'
        - name: Integration Test
          commands:
            - sem-service start postgres
            - 'docker run --net=host -it $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' npm run test'
  - name: Push
    task:
      secrets:
        - name: dockerhub
      jobs:
        - name: Push
          commands:
            - docker login
            - 'docker pull $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID'
            - 'docker tag $DOCKER_USERNAME/demo:$SEMAPHORE_WORKFLOW_ID \'
            - ' $DOCKER_USERNAME/demo:latest'
            - 'docker push $DOCKER_USERNAME/demo:latest'
